<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia JS</title>
</head>
<body>
    <h1>Farmácia JS</h1>

    <p>
        Medicamento: <input type="text" id="inMedicamento">
    </p>
    <p>
        Preço R$: <input type="text" id="inPreco">
    </p>
   
    <p>
        <input type="button" value="Mostrar Promoção" id="btMostrar">
    </p>

    <h3 id="outMedicamento"></h3>
    <h3 id="outPromocao"></h3> 

    <script>
        const btMostrar = document.getElementById("btMostrar");
        const inMedicamento = document.getElementById("inMedicamento");
        const inPreco = document.getElementById("inPreco");
        const outMedicamento = document.getElementById("outMedicamento");
        const outPromocao = document.getElementById("outPromocao");

        btMostrar.addEventListener("click", () => {
            const medicamento = inMedicamento.value;
            const preco = Number(inPreco.value);
            
            const total = preco * 2;
            const promocao = Math.floor(total); 

            outMedicamento.innerText = "Promoção de " + medicamento;
            outPromocao.innerText = "Leve 2 por apenas R$: " + promocao.toFixed(2);
        });
    </script>
</body>
</html>
