<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado JS</title>
</head>
<body>
    <h1>Supermercado JS</h1>

    <p>
        Produto: <input type="text" id="inProduto">
    </p>
    <p>
        Preço R$: <input="text" id="inPreco">
    </p>
    <p>
        <input type="button" value="Ver Promoção" id="btVerPromocao">
    </p>

    <h3 id="outPromocao1"></h3>
    <h3 id="outPromocao2"></h3>

    <script>
        const btVerPromocao = document.getElementById("btVerPromocao");
        const inProduto = document.getElementById("inProduto");
        const inPreco = document.getElementById("inPreco");
        const outPromocao1 = document.getElementById("outPromocao1");
        const outPromocao2 = document.getElementById("outPromocao2");

        btVerPromocao.addEventListener("click", () => {
            const produto = inProduto.value;
            const preco = Number(inPreco.value);
            
            const duasUnidades = preco * 2;
            const terceiraUnidade = preco * 0.5;
            const total = duasUnidades + terceiraUnidade;

            outPromocao1.innerText = produto + " - Promoção: Leve 3 por R$: " + total.toFixed(2);
            outPromocao2.innerText = "O 3º produto custa apenas R$: " + terceiraUnidade.toFixed(2);
        });
    </script>
</body>
</html>
